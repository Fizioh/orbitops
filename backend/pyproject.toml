[project]
name = "orbitops-backend"
version = "0.1.0"
description = "OrbitOps mission operations API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
  "Django>=5.1,<5.2",
  "djangorestframework>=3.15,<4",
  "django-cors-headers>=4.4,<5",
  "django-filter>=24.3,<25",
  "psycopg[binary]>=3.2,<4",
  "celery[redis]>=5.4,<6",
  "redis>=5.0,<6",
  "django-environ>=0.11,<1",
  "gunicorn>=22.0,<24",
  "uvicorn[standard]>=0.30,<1",
  "skyfield>=1.49,<2",
  "sgp4>=2.23,<3",
  "astropy>=6.1,<7",
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-django>=4.9,<5",
  "pytest-cov>=5.0,<6",
  "hypothesis>=6.112,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "django-stubs>=5.1,<6",
  "djangorestframework-stubs>=3.15,<4",
  "types-redis>=4.6,<5",
]
ortools = [
  "ortools>=9.10,<10",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "apps*", "shared*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
addopts = "-q"
testpaths = ["apps", "shared", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["mypy_django_plugin.main"]
warn_unused_ignores = true
packages = ["apps", "shared", "config"]

[[tool.mypy.overrides]]
module = ["environ.*", "celery.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"
